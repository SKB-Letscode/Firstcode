server {
    listen 80;
    server_name _;  # Replace with your domain name if you have one
    
    # Optional: Redirect to HTTPS
    # return 301 https://$server_name$request_uri;

    # Maximum upload size for images
    client_max_body_size 20M;

    # Main application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files (if serving directly from nginx)
    # location /static {
    #     alias /home/ubuntu/fmf-app/app/web;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # Logging
    access_log /var/log/nginx/fmf-app-access.log;
    error_log /var/log/nginx/fmf-app-error.log;
}

